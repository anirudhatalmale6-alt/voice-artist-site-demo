<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Placeholder illustration: a silhouette at a studio microphone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#221b12"/>
      <stop offset="0.5" stop-color="#15110c"/>
      <stop offset="1" stop-color="#0b0a09"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#e9a23b" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#e9a23b" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#e9a23b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0.2" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#e9a23b" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#ff4d18" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff4d18" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="frame"><rect width="800" height="1000"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="1000" fill="url(#bg)"/>
    <rect width="800" height="1000" fill="url(#glow)"/>

    <!-- acoustic treatment on the back wall -->
    <g stroke="#f4eee4" stroke-opacity="0.045" stroke-width="1">
      <path d="M0 130H800M0 310H800M0 490H800M0 670H800M0 850H800"/>
      <path d="M140 0V1000M320 0V1000M500 0V1000M680 0V1000"/>
    </g>
    <g fill="#f4eee4" fill-opacity="0.022">
      <rect x="150" y="150" width="160" height="160" rx="3"/>
      <rect x="510" y="330" width="160" height="160" rx="3"/>
      <rect x="330" y="150" width="160" height="160" rx="3"/>
    </g>

    <!-- soft key light behind the figure -->
    <ellipse cx="330" cy="600" rx="240" ry="260" fill="#e9a23b" fill-opacity="0.18" filter="url(#soft)"/>

    <!-- the figure: one silhouette, head + neck + shoulders -->
    <g>
      <path d="M60 1000c0-176 118-268 270-268s270 92 270 268z" fill="#0b0a09"/>
      <path d="M330 470c72 0 118 58 118 132s-46 138-118 138-118-64-118-138 46-132 118-132z" fill="#0b0a09"/>
      <path d="M292 726h76v46h-76z" fill="#0b0a09"/>

      <!-- rim light along the top-right edge of the silhouette -->
      <path d="M330 470c72 0 118 58 118 132 0 30-8 58-22 80" fill="none" stroke="url(#rim)" stroke-width="7" stroke-linecap="round"/>
      <path d="M600 1000c0-140-75-226-190-256" fill="none" stroke="url(#rim)" stroke-width="6" stroke-linecap="round" opacity="0.75"/>

      <!-- headphones -->
      <path d="M204 604a126 126 0 0 1 252 0" fill="none" stroke="#f4eee4" stroke-opacity="0.22" stroke-width="14" stroke-linecap="round"/>
      <rect x="182" y="576" width="46" height="96" rx="20" fill="#0b0a09" stroke="#f4eee4" stroke-opacity="0.18" stroke-width="3"/>
      <rect x="432" y="576" width="46" height="96" rx="20" fill="#0b0a09" stroke="#e9a23b" stroke-opacity="0.45" stroke-width="3"/>
    </g>

    <!-- pop filter, foreground -->
    <g transform="translate(500,470) rotate(12)" opacity="0.55">
      <ellipse rx="86" ry="90" fill="#f4eee4" fill-opacity="0.03" stroke="#f4eee4" stroke-opacity="0.28" stroke-width="4"/>
      <path d="M0 90 L14 190" stroke="#f4eee4" stroke-opacity="0.2" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- condenser mic on its boom, closest to camera -->
    <g transform="translate(596,300) rotate(13)">
      <path d="M0 250 L-40 470" stroke="#0b0a09" stroke-width="18" stroke-linecap="round"/>
      <path d="M0 250 L-40 470" stroke="#f4eee4" stroke-opacity="0.14" stroke-width="4" stroke-linecap="round"/>
      <rect x="-12" y="192" width="24" height="66" rx="4" fill="#0b0a09" stroke="#f4eee4" stroke-opacity="0.2" stroke-width="2"/>
      <rect x="-52" y="0" width="104" height="204" rx="52" fill="#100d0a" stroke="#e9a23b" stroke-opacity="0.6" stroke-width="2.5"/>
      <g stroke="#e9a23b" stroke-opacity="0.32" stroke-width="2">
        <path d="M-46 32H46M-50 60H50M-52 88H52M-50 116H50M-46 144H46M-40 172H40"/>
        <path d="M-26 6V198M0 2V202M26 6V198"/>
      </g>
      <rect x="-52" y="0" width="104" height="204" rx="52" fill="url(#rim)" opacity="0.12"/>
    </g>

    <!-- level meter, bottom left -->
    <g fill="#e9a23b" fill-opacity="0.6">
      <rect x="56" y="930" width="4" height="26" rx="2"/>
      <rect x="72" y="914" width="4" height="58" rx="2"/>
      <rect x="88" y="896" width="4" height="94" rx="2"/>
      <rect x="104" y="920" width="4" height="46" rx="2"/>
      <rect x="120" y="904" width="4" height="78" rx="2"/>
      <rect x="136" y="934" width="4" height="18" rx="2"/>
      <rect x="152" y="910" width="4" height="66" rx="2"/>
      <rect x="168" y="926" width="4" height="34" rx="2"/>
      <rect x="184" y="900" width="4" height="86" rx="2"/>
    </g>

    <rect width="800" height="1000" filter="url(#grain)" opacity="0.07"/>
  </g>
</svg>
